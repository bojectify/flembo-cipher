[package]
name = "flembo-cipher"
version = "0.1.0"
edition = "2024"
description = "Turn a phrase into a letter-substitution code, with JSON output"
license = "MIT"
repository = "https://github.com/bojectify/flembo-cipher"
homepage = "https://github.com/bojectify/flembo-cipher"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
